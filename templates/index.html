<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="calculator">
    <h1>Calculator</h1>
    <p class="note">Addition is the only operation available right now.</p>

    <form id="calc-form" autocomplete="off">
      <div class="row">
        <label for="a">First number</label>
        <input type="number" id="a" name="a" step="any" required>
      </div>

      <div class="row">
        <label for="operation">Operation</label>
        <select id="operation" name="operation">
          <option value="add" selected>+ &nbsp;Addition</option>
          <option value="subtract" disabled>&minus; &nbsp;Subtraction (coming soon)</option>
          <option value="multiply" disabled>&times; &nbsp;Multiplication (coming soon)</option>
          <option value="divide" disabled>&divide; &nbsp;Division (coming soon)</option>
        </select>
      </div>

      <div class="row">
        <label for="b">Second number</label>
        <input type="number" id="b" name="b" step="any" required>
      </div>

      <button type="submit">Calculate</button>
    </form>

    <output id="result" role="status" aria-live="polite"></output>
  </main>

  <script>
    const form = document.getElementById("calc-form");
    const output = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      output.textContent = "";
      output.className = "";

      const body = {
        a: document.getElementById("a").value,
        b: document.getElementById("b").value,
        operation: document.getElementById("operation").value,
      };

      try {
        const response = await fetch("/api/calculate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (response.ok) {
          output.className = "ok";
          output.textContent = `${data.a} + ${data.b} = ${data.result}`;
        } else {
          output.className = "error";
          output.textContent = data.error;
        }
      } catch (err) {
        output.className = "error";
        output.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
